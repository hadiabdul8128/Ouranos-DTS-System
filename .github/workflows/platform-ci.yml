name: Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  checks:
    name: Contracts, types, unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev --include=optional --no-audit --no-fund
      - name: Verify generated API contract
        run: npm run platform:contracts -- --check
      - name: Typecheck and unit tests
        run: npm run platform:check
      - name: Build Vercel frontend
        # Match Vercel's clean install: the standalone app is not installed yet.
        env:
          NEXT_PUBLIC_OURANOS_API_URL: ""
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
        run: npm run build:vercel
      - name: Install preserved voucher module
        run: npm --prefix voucher ci --include=dev --include=optional --no-audit --no-fund
      - name: Check preserved voucher module
        run: |
          npm --prefix voucher test
          npm --prefix voucher run build
      - name: Build frontend preview
        # This job does not receive a production backend or authentication key.
        env:
          NEXT_PUBLIC_OURANOS_API_URL: ""
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
        run: npm run build
      - name: Build backend container
        run: docker build --file Dockerfile.platform --tag ouranos-platform:ci .
      - name: Build optional receipt provider
        run: docker build --file Dockerfile.receipts --tag ouranos-receipts:ci .

  integration:
    name: Local Supabase integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev --include=optional --no-audit --no-fund
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: "2.107.0"
      - name: Start isolated Auth, Storage and PostgreSQL
        # Startup can print local credentials. Keep that output in the ephemeral
        # runner rather than uploading logs or persisting it as an artifact.
        run: |
          if ! supabase start > "$RUNNER_TEMP/ouranos-supabase-start.log" 2>&1; then
            echo "::error::Local Supabase failed to start. Review container health and reproduce with Supabase CLI 2.107.0."
            docker ps --all --format '{{.Names}} {{.Status}}'
            exit 1
          fi
      - name: Configure loopback test environment
        run: npm run platform:local
      - name: Test API, RLS, approvals and receipt processing
        run: npm run platform:test:integration
      - name: Stop local services and remove temporary credentials
        if: always()
        run: |
          supabase stop --no-backup
          rm -f .env.platform .env.local "$RUNNER_TEMP/ouranos-supabase-start.log"
